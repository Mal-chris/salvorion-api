name: CI

on:
  push:
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Format & test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salvorion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Erlang/Elixir (versions from .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Guardian signs JWTs with RS256, which needs a real RSA key pair on
      # disk (Salvorion.Accounts.Keys.load!/0 raises at application boot
      # without one). priv/keys/ is git-ignored on purpose (docs/DECISIONS.md,
      # "Guardian must use an asymmetric signing key") — never commit a real
      # key, generate a throwaway one per CI run instead, identical to the
      # local dev setup (lib/salvorion/accounts/keys.ex's own error message).
      - name: Generate a throwaway RSA signing key pair for this CI run
        run: |
          mkdir -p priv/keys
          openssl genrsa -out priv/keys/dev_private.pem 2048
          openssl rsa -in priv/keys/dev_private.pem -pubout -out priv/keys/dev_public.pem

      - name: Run tests
        run: mix test
