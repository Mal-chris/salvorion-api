name: CI

on:
  push:
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Format & test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salvorion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Reporting's render_report_pdf/1 (Prompt 11) calls this over real
      # HTTP; docker-compose.yml's own gotenberg service is the reference
      # for image and port. This job has no top-level `container:` key, so
      # it runs directly on the runner (not itself inside a container) —
      # per GitHub's own docs, a service in that mode is reached via
      # `localhost:<mapped-port>` on the runner, not via the service name
      # as a hostname (that mapping is only automatic when the job *also*
      # runs in a container, sharing its private network with services).
      # `localhost:3000` is already config.exs's compiled-in
      # `:gotenberg_url` default for every environment including test, so
      # mapping the container's port 3000 straight to the runner's 3000
      # needs no config change.
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -f http://localhost:3000/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Erlang/Elixir (versions from .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Guardian signs JWTs with RS256, which needs a real RSA key pair on
      # disk (Salvorion.Accounts.Keys.load!/0 raises at application boot
      # without one). priv/keys/ is git-ignored on purpose (docs/DECISIONS.md,
      # "Guardian must use an asymmetric signing key") — never commit a real
      # key, generate a throwaway one per CI run instead, identical to the
      # local dev setup (lib/salvorion/accounts/keys.ex's own error message).
      - name: Generate a throwaway RSA signing key pair for this CI run
        run: |
          mkdir -p priv/keys
          openssl genrsa -out priv/keys/dev_private.pem 2048
          openssl rsa -in priv/keys/dev_private.pem -pubout -out priv/keys/dev_public.pem

      - name: Run tests
        run: mix test
